name: Tests

on:
  push:
    branches: [master, code-review-fixes]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    name: Python ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Install the package the way an end user gets it (fresh dependency
      # resolution against pyproject.toml), rather than from the lock file:
      # this is what verifies the declared dependency bounds and each
      # matrix Python version actually work.
      - name: Install package
        run: python -m pip install .

      - name: Unit tests
        run: ./run_unittests.sh

      - name: Doctests
        run: ./run_doctests.sh

  docs:
    runs-on: ubuntu-latest
    name: Docs build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and docs tooling
        run: python -m pip install . sphinx furo

      - name: Build HTML docs
        run: python -m sphinx -b html docs/source docs/_build/html
