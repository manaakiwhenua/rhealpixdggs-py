name: Tests

on:
  push:
    branches: [master, code-review-fixes]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    name: Python ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Install the package the way an end user gets it (fresh dependency
      # resolution against pyproject.toml), rather than from the lock file:
      # this is what verifies the declared dependency bounds and each
      # matrix Python version actually work. The harmonics extra brings
      # ducc0, without which the harmonics tests and doctests are skipped.
      - name: Install package
        run: python -m pip install ".[harmonics]"

      - name: Unit tests
        if: matrix.python-version != '3.12'
        run: ./scripts/run_unittests.sh

      - name: Doctests
        if: matrix.python-version != '3.12'
        run: ./scripts/run_doctests.sh

      - name: Unit tests and doctests under coverage
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install coverage
          ./scripts/run_coverage.sh

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: true

  lint:
    runs-on: ubuntu-latest
    name: Formatting and lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Install the exact locked tool versions, so this job always agrees
      # with a local `poetry run` check.
      - name: Install locked dev environment
        run: |
          python -m pip install poetry
          poetry install --with dev

      - name: black --check
        run: poetry run black --check --diff .

      - name: ruff check
        run: poetry run ruff check .

      - name: mypy
        run: poetry run mypy

  docs:
    runs-on: ubuntu-latest
    name: Docs build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and docs tooling
        run: python -m pip install ".[harmonics]" sphinx furo

      - name: Build HTML docs
        run: python -m sphinx -b html docs/source docs/_build/html
