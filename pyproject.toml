[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "rHEALPixDGGS"
version = "0.8.6"
description = "An implementation of the rHEALPix discrete global grid system"
authors = [
    { name = "Alexander Raichev", email = "alex@raichev.net" },
    { name = "Robert Gibb", email = "gibbr@landcareresearch.co.nz" }
]
maintainers = [
    { name = "Richard Law", email = "lawr@landcareresearch.co.nz" }
]
readme = "README.md"
license = "LGPL-3.0-or-later OR MIT"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.11",
    "pyproj>=3.6",
    "shapely>=2.1"
]
 
keywords = [
    "DGGS",
    "Discrete Global Grid System",
    "reference system",
    "spatial",
    "geospatial"
]
 
classifiers = [
    "Development Status :: 4 - Beta",
    "Topic :: Utilities",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
 
[project.optional-dependencies]
harmonics = ["ducc0>=0.41"]

[project.urls]
bug_reports = "https://github.com/manaakiwhenua/rhealpixdggs-py/issues"
documentation = "https://manaakiwhenua.github.io/rhealpixdggs-py/"
source = "https://github.com/manaakiwhenua/rhealpixdggs-py"
 
[tool.poetry.group.dev.dependencies]
black = "^25"
ruff = "^0.16"
mypy = "^2.3"
scipy-stubs = "*"
types-shapely = "*"
pytest = "^7.4.0"
sphinx = "^7.2"
furo = ">=2024.8"
coverage = "^7.16.1"

[tool.poetry.group.figures]
optional = true

[tool.poetry.group.figures.dependencies]
matplotlib = "3.11.1"

[tool.poetry]
include = ["tests/", "docs/"]

[tool.mypy]
files = ["rhealpixdggs"]
check_untyped_defs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "ducc0.*"
ignore_missing_imports = true

[tool.coverage.run]
source = ["rhealpixdggs"]

[tool.coverage.report]
fail_under = 94
skip_empty = true
show_missing = true
